name: SEO GEO V2 Batch

on:
  push:
    branches:
      - seo/geo-v2-batch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: seo/geo-v2-batch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply SEO/GEO V2 batch
        run: python scripts/seo_geo_v2_batch.py
      - name: Validate generated HTML and XML basics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          pet=list((root/'pet').glob('*.html'))
          assert len(pet) >= 29, len(pet)
          for p in [root/'blog'/'sitemap.xml', root/'pet'/'sitemap.xml', root/'llms.txt', root/'llms-full.txt']:
              assert p.exists(), p
          bad=[]
          for p in root.rglob('*.html'):
              if p.parts[0] in {'wordpress','blogger','tests'}:
                  continue
              t=p.read_text(encoding='utf-8')
              if 'japanmedai.com' in t and 'https://japanmedai.com' in t:
                  bad.append(str(p))
          assert not bad, bad
          print('Validation OK:', len(pet), 'pet HTML files')
          PY
      - name: Commit generated changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply JapanMedAI SEO/GEO V2 batch"
          git push origin HEAD:seo/geo-v2-batch
