name: Promote Domain Hubs
on:
  push:
    branches:
      - seo/domain-hubs
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/domain-hubs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote JapanMedAI first-party hubs
        run: python scripts/promote_domain_hubs.py
      - name: Validate hub files and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          hubs=['bnct','ips','second-opinion','checkup','medicines','hospitals','kampo']
          for h in hubs:
              p=Path(h)/'index.html'
              assert p.exists(), p
              t=p.read_text(encoding='utf-8')
              assert f'https://www.japanmedai.com/{h}/' in t, h
          blog=Path('blog/index.html').read_text(encoding='utf-8')
          for h in ['bnct','ips','checkup','medicines','hospitals','kampo']:
              assert f'href="/{h}/"' in blog, h
          home=Path('index.html').read_text(encoding='utf-8')
          for h in ['bnct','ips','checkup','medicines']:
              assert f'href="/{h}/"' in home, h
          print('Hub validation OK')
          PY
      - name: Commit generated changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote JapanMedAI first-party domain hubs"
          git push origin HEAD:seo/domain-hubs
