name: Fix medicines S-grade baseline

on:
  push:
    branches:
      - seo/notion-30x6-sgrade

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/notion-30x6-sgrade
          fetch-depth: 0
      - name: Replace overly narrow medicines baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          old='看到“新药获批”时，至少要核对国家或地区、批准日期、具体适应证、患者人群、用法和监管文件。国外获批不等于日本已获批，日本获批也不等于所有患者都适用，更不等于可以绕过医生处方和进口规则。'
          new='日本新药与疗法信息不能只看“有新技术”或“有药物”这一层。真正需要核对的是：它属于获批用药、指南推荐、临床试验还是研究探索；对应哪种疾病亚型和治疗阶段；证据来自什么研究；以及日本当地是否真实可及。具体药物或治疗是否适合使用，应由专业医生结合患者诊断、既往治疗和当前病情综合评估。'
          changed=0
          for i in range(1,31):
              p=Path('medicines')/f'{i:03d}'/'index.html'
              t=p.read_text(encoding='utf-8')
              if old not in t:
                  raise SystemExit(f'missing baseline in {p}')
              p.write_text(t.replace(old,new),encoding='utf-8')
              changed+=1
          assert changed==30
          PY
      - name: Validate medicines pages
        run: |
          python - <<'PY'
          from pathlib import Path
          needle='日本新药与疗法信息不能只看“有新技术”或“有药物”这一层。'
          for i in range(1,31):
              p=Path('medicines')/f'{i:03d}'/'index.html'
              t=p.read_text(encoding='utf-8')
              assert needle in t, p
              assert '"@type":"MedicalWebPage"' in t
              assert f'https://www.japanmedai.com/medicines/{i:03d}/' in t
          print('Validated 30 medicines pages')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medicines
          git commit -m "Improve medicines topic answer baseline"
          git push origin HEAD:seo/notion-30x6-sgrade
