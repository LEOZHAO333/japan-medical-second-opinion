name: PR62 finalize locked logo
on:
  push:
    branches: [website-final-logo-wechat-attribution-v1]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-final-logo-wechat-attribution-v1
      - name: Diagnose staged Base64
        shell: python
        run: |
          import pathlib, re
          names=['.pr62/logo.part00','.pr62/logo.part01','.pr62/logo.part02','.pr62/logo.tail00']
          for name in names:
              s=pathlib.Path(name).read_text(encoding='utf-8')
              compact=''.join(s.split())
              bad=re.findall(r'[^A-Za-z0-9+/=]',compact)
              print(name, 'raw=',len(s),'compact=',len(compact),'mod4=',len(compact)%4,'bad=',bad[:10],'head=',compact[:12],'tail=',compact[-12:])
      - name: Rebuild Founder-locked PNG and verify SHA-256
        shell: python
        run: |
          import base64, hashlib, pathlib
          names=['.pr62/logo.part00','.pr62/logo.part01','.pr62/logo.part02','.pr62/logo.tail00']
          s=''.join(''.join(pathlib.Path(n).read_text(encoding='utf-8').split()) for n in names)
          print('combined_base64_len=',len(s),'mod4=',len(s)%4)
          raw=base64.b64decode(s, validate=True)
          out=pathlib.Path('assets/BUNTO-logo-version-02.png')
          out.write_bytes(raw)
          actual=hashlib.sha256(raw).hexdigest()
          expected='1922ef92cebbeae2ddb07eab97352b7ce468f419d34e73629ef364473ef9c982'
          print('logo_bytes=',len(raw))
          print('logo_sha256=',actual)
          if actual != expected:
              raise SystemExit(f'SHA mismatch: expected {expected}')
      - name: Remove obsolete vector and temporary staging files
        shell: bash
        run: |
          rm -f assets/BUNTO-logo-version-02.svg
          rm -rf .pr62
          rm -f .github/workflows/pr62-logo-finalize.yml
      - name: Commit verified locked PNG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Founder-locked Version 02 PNG asset"
          git push origin HEAD:website-final-logo-wechat-attribution-v1
