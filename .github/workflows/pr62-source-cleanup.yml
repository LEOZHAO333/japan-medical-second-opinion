name: PR62 one-shot source cleanup
on:
  push:
    branches: [website-final-logo-wechat-attribution-v1]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-final-logo-wechat-attribution-v1
      - name: Remove WhatsApp contact cards from source
        shell: python
        run: |
          import pathlib, re
          files = [
            'index.html',
            'second-opinion/index.html',
            'en/index.html',
            'zh-hant/index.html',
            'weight/index.html',
            'weight/en.html',
            'weight/zh-hant.html',
            'weight-v3/index.html',
          ]
          patterns = [
            re.compile(r'<div class="contactItem"><h3>WhatsApp</h3>.*?</div>', re.S | re.I),
            re.compile(r'<div class="contact"><h3>WhatsApp</h3>.*?</div>', re.S | re.I),
          ]
          changed = []
          for name in files:
            p = pathlib.Path(name)
            if not p.exists():
              continue
            s = p.read_text(encoding='utf-8')
            original = s
            for pat in patterns:
              s = pat.sub('', s)
            if s != original:
              p.write_text(s, encoding='utf-8')
              changed.append(name)
          print('changed:', changed)
          if not changed:
            print('No WhatsApp cards found in target HTML files.')
      - name: Remove this one-shot workflow and commit
        run: |
          rm -f .github/workflows/pr62-source-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html second-opinion/index.html en/index.html zh-hant/index.html weight/index.html weight/en.html weight/zh-hant.html weight-v3/index.html .github/workflows/pr62-source-cleanup.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove WhatsApp contact cards from public HTML source"
          git push origin HEAD:website-final-logo-wechat-attribution-v1
