name: Weight 50 external reference audit

on:
  push:
    branches:
      - audit/weight-50-live-20261029
    paths:
      - .github/workflows/weight-external-sources.yml

permissions:
  contents: read

jobs:
  source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure public article HTML equals published baseline
        run: git diff --exit-code b66c42de75c3a950be3b4b9159d6bd2650f2188a HEAD -- weight/articles
      - name: Run read-only source link audit
        run: python3 scripts/check_weight_external_sources.py
      - name: Save non-sensitive URL status report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weight-50-source-reachability-20261029
          path: weight-source-audit/
          retention-days: 30
