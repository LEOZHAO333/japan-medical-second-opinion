name: Final search intent QA

on:
  push:
    branches:
      - seo/dedupe-intent-refine

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/dedupe-intent-refine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final semantic QA in one batch
        run: python scripts/final_intent_qa.py
      - name: Remove one-off QA helpers
        run: rm -f scripts/final_intent_qa.py .github/workflows/final-intent-qa.yml
      - name: Commit finalized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize category-specific search intent QA for 180 pages"
          git push origin HEAD:seo/dedupe-intent-refine
