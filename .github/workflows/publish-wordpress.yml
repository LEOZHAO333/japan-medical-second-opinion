name: Publish WordPress draft

on:
  push:
    branches: [main]
    paths:
      - "wordpress/**/*.html"
  workflow_dispatch:
    inputs:
      file:
        description: "Optional wordpress/*.html file to publish"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wordpress-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: wordpress
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select WordPress files
        id: files
        shell: bash
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            printf '%s\n' "${{ inputs.file }}" > /tmp/wordpress-files.txt
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'wordpress/*.html' > /tmp/wordpress-files.txt
          else
            find wordpress -maxdepth 1 -type f -name '*.html' -print > /tmp/wordpress-files.txt
          fi
          sed -i '/^[[:space:]]*$/d' /tmp/wordpress-files.txt
          echo "count=$(wc -l < /tmp/wordpress-files.txt)" >> "$GITHUB_OUTPUT"

      - name: Add JapanMed public footer
        if: steps.files.outputs.count != '0'
        run: |
          python3 scripts/add_external_footer.py --file-list /tmp/wordpress-files.txt

      - name: Publish or update WordPress drafts
        if: steps.files.outputs.count != '0'
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_STATUS: draft
        run: |
          python3 scripts/publish_wordpress.py --file-list /tmp/wordpress-files.txt
