name: Apply internal-link S30 batch

on:
  push:
    branches:
      - seo/internal-link-s30

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: seo/internal-link-s30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build internal-link graph and S30 decision paths
        run: python scripts/build_internal_links_s30.py
      - name: Remove one-off workflow before final batch commit
        run: rm .github/workflows/apply-internal-link-s30.yml
      - name: Commit complete batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build 180-page internal-link graph and S30 decision paths [skip ci]"
          git push origin HEAD:seo/internal-link-s30
