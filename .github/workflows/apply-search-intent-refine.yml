name: Apply search intent refinement

on:
  push:
    branches:
      - seo/dedupe-intent-refine

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/dedupe-intent-refine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one-batch dedupe and search-intent refinement
        run: python scripts/refine_search_intent.py
      - name: Remove one-off migration helpers
        run: rm -f scripts/refine_search_intent.py .github/workflows/apply-search-intent-refine.yml
      - name: Commit the complete batch once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine 180 medical search intents and remove topic cannibalization"
          git push origin HEAD:seo/dedupe-intent-refine
