name: Sync WordPress source to JapanMedAI blog

on:
  push:
    branches: [main]
    paths:
      - "wordpress/**/*.html"
      - "scripts/sync_wordpress_to_blog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordpress-to-blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror WordPress source into /blog
        run: python3 scripts/sync_wordpress_to_blog.py

      - name: Commit synchronized blog files
        shell: bash
        run: |
          if git diff --quiet -- blog; then
            echo "No blog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          git commit -m "Sync WordPress content to JapanMedAI blog [skip ci]"
          git push origin HEAD:main
