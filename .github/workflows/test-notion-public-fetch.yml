name: Test Notion Public Fetch

on:
  push:
    branches:
      - seo/notion-30x6-sync

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/notion-30x6-sync
          fetch-depth: 0
      - name: Fetch one public Notion page with browser-like HTTP
        run: |
          mkdir -p .notion-test
          curl -L --retry 5 --retry-delay 3 --fail \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            'https://japanmedai.notion.site/379b079dc60680d9bd37db9fd91a0ea1' \
            -o .notion-test/sample.html
          test -s .notion-test/sample.html
          wc -c .notion-test/sample.html
          grep -o '日本BNCT硼中子治疗到底是什么[^<]*' .notion-test/sample.html | head -1 || true
      - name: Commit test output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .notion-test/sample.html
          git commit -m 'Verify public Notion HTML fetch' || exit 0
          git push origin HEAD:seo/notion-30x6-sync
