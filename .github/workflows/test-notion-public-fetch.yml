name: Test Notion Public Fetch

on:
  push:
    branches:
      - seo/notion-30x6-sync

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/notion-30x6-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Notion public fetcher
        run: python -m pip install --disable-pip-version-check notion-site-fetch
      - name: Fetch one public Notion page
        run: |
          mkdir -p .notion-test
          notion-site-fetch 'https://japanmedai.notion.site/379b079dc60680d9bd37db9fd91a0ea1' > .notion-test/sample.md
          test -s .notion-test/sample.md
          wc -c .notion-test/sample.md
          head -n 12 .notion-test/sample.md
      - name: Commit test output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .notion-test/sample.md
          git commit -m 'Verify public Notion content sync' || exit 0
          git push origin HEAD:seo/notion-30x6-sync
