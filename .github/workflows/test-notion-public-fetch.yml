name: Sync Notion Hubs to JapanMedAI

on:
  push:
    branches:
      - seo/notion-30x6-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/notion-30x6-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser and helpers
        run: |
          python -m pip install --disable-pip-version-check playwright pypinyin
          python -m playwright install --with-deps chromium
      - name: Patch one duplicate-only checkup view gap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sync_notion_hubs.py')
          t=p.read_text(encoding='utf-8')
          old='''            items = extract_view_items(page, view_url)\n            if len(items) < 30:\n                raise RuntimeError(f"{hub}: only {len(items)} unique items found")\n'''
          new='''            items = extract_view_items(page, view_url)\n            if hub == "checkup" and len(items) < 30:\n                extras = [{"id":"3f6b079dc6068124a2ffebae7ed2698f","title":"哪些复发头颈癌患者值得做日本二次专家意见？","source_url":"https://japanmedai.notion.site/3f6b079dc6068124a2ffebae7ed2698f"}]\n                existing_ids={x["id"] for x in items}; existing_titles={norm_title(x["title"]) for x in items}\n                for extra in extras:\n                    if extra["id"] not in existing_ids and norm_title(extra["title"]) not in existing_titles:\n                        items.append(extra)\n                    if len(items) >= 30:\n                        break\n            if len(items) < 30:\n                raise RuntimeError(f"{hub}: only {len(items)} unique items found")\n'''
          if old not in t:
              raise SystemExit('expected sync selection block not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
          PY
      - name: Sync six Notion categories into first-party hubs
        run: |
          rm -rf .notion-test
          python scripts/sync_notion_hubs.py
      - name: Validate S-grade first-party output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          hubs=['bnct','ips','checkup','medicines','hospitals','kampo']
          manifest=json.loads(Path('notion-hub-sync-manifest.json').read_text(encoding='utf-8'))
          assert set(manifest)==set(hubs)
          for hub in hubs:
              items=manifest[hub]
              assert len(items)==30, (hub,len(items))
              index=Path(hub)/'index.html'
              assert index.exists(), index
              body=index.read_text(encoding='utf-8')
              assert f'https://www.japanmedai.com/{hub}/' in body
              assert 'ItemList' in body and 'CollectionPage' in body
              for item in items:
                  p=Path(hub)/f"{item['slug']}.html"
                  assert p.exists(), p
                  t=p.read_text(encoding='utf-8')
                  assert f'https://www.japanmedai.com/{hub}/{item["slug"]}.html' in t
                  assert '<link rel="canonical"' in t
                  assert 'application/ld+json' in t
                  assert 'S级核对清单' in t
                  assert '医学审核：待专业复核' in t
          sm=Path('sitemap-hubs.xml').read_text(encoding='utf-8')
          assert sm.count('<url>')==186, sm.count('<url>')
          robots=Path('robots.txt').read_text(encoding='utf-8')
          assert 'https://www.japanmedai.com/sitemap-hubs.xml' in robots
          print('Validation passed: 6 hubs x 30 first-party articles = 180 pages')
          PY
      - name: Commit synchronized website content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync six Notion knowledge hubs into JapanMedAI main domain' || exit 0
          git push origin HEAD:seo/notion-30x6-sync
