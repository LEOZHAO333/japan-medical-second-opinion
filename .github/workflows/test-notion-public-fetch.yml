name: Sync Notion Hubs to JapanMedAI

on:
  push:
    branches:
      - seo/notion-30x6-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/notion-30x6-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser and helpers
        run: |
          python -m pip install --disable-pip-version-check playwright pypinyin
          python -m playwright install --with-deps chromium
      - name: Sync six Notion categories into first-party hubs
        run: |
          rm -rf .notion-test
          python scripts/sync_notion_hubs.py
      - name: Validate S-grade first-party output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          hubs=['bnct','ips','checkup','medicines','hospitals','kampo']
          manifest=json.loads(Path('notion-hub-sync-manifest.json').read_text(encoding='utf-8'))
          assert set(manifest)==set(hubs)
          for hub in hubs:
              items=manifest[hub]
              assert len(items)==30, (hub,len(items))
              index=Path(hub)/'index.html'
              assert index.exists(), index
              body=index.read_text(encoding='utf-8')
              assert f'https://www.japanmedai.com/{hub}/' in body
              assert 'ItemList' in body and 'CollectionPage' in body
              article_files=[]
              for item in items:
                  p=Path(hub)/f"{item['slug']}.html"
                  assert p.exists(), p
                  t=p.read_text(encoding='utf-8')
                  assert f'https://www.japanmedai.com/{hub}/{item["slug"]}.html' in t
                  assert '<link rel="canonical"' in t
                  assert 'application/ld+json' in t
                  assert 'S级核对清单' in t
                  assert '医学审核：待专业复核' in t
                  article_files.append(p)
              assert len(article_files)==30
          sm=Path('sitemap-hubs.xml').read_text(encoding='utf-8')
          assert sm.count('<url>')==186, sm.count('<url>')
          robots=Path('robots.txt').read_text(encoding='utf-8')
          assert 'https://www.japanmedai.com/sitemap-hubs.xml' in robots
          print('Validation passed: 6 hubs x 30 first-party articles = 180 pages')
          PY
      - name: Commit synchronized website content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync six Notion knowledge hubs into JapanMedAI main domain' || exit 0
          git push origin HEAD:seo/notion-30x6-sync
