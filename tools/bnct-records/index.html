main class="article"><div class="crumb"><a href="/">首页</a> › 资料自查工具</div><article><header><span class="kicker">SELF-CHECK TOOL</span><h1>BNCT资料完整度自查｜病理、DICOM、既往放疗计划</h1><p class="lead">不上传病历、不留联系方式，只检查目前手上的资料是否齐全。</p></header><section class="panel"><div class="grid"><label class="check"><input type="checkbox" class="jmaiCheck">病理报告或近期病理复核结果</label><label class="check"><input type="checkbox" class="jmaiCheck">近期CT/MRI/PET报告</label><label class="check"><input type="checkbox" class="jmaiCheck">原始DICOM影像文件</label><label class="check"><input type="checkbox" class="jmaiCheck">既往放疗计划/剂量资料（如做过放疗）</label><label class="check"><input type="checkbox" class="jmaiCheck">手术、化疗、免疫/靶向治疗时间线</label><label class="check"><input type="checkbox" class="jmaiCheck">当前症状、体能和主要问题</label></div><div class="result">已准备 <b id="score">0</b> / 6 项</div><p class="small">这不是BNCT适应证判断。资料是否足够、是否需要补充检查，应由接诊机构确认。</p></section><section class="panel"><h2>怎么用结果？</h2><p>先补最基础资料，再整理一页治疗时间线和3—5个核心问题；不要为了凑齐清单自行追加医学检查。</p><p><a class="btn" href="/second-opinion/">进入二次会诊预评估</a></p></section></article></main><script>const cs=[...document.querySelectorAll('.jmaiCheck')],s=document.getElementById('score');cs.forEach(c=>c.addEventListener('change',()=>s.textContent=cs.filter(x=>x.checked).length));</script><footer class="footer"><div class="wrap">JapanMedAI · 文腾株式会社｜内容用于医学信息教育与跨境医疗决策准备，不替代医疗团队诊疗。</div></footer><script src="/assets/jmai-analytics.js"></script></body></html>
