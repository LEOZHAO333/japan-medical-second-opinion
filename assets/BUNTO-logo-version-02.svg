  <path d="M 124 620 Q 310 604 500 619 Q 690 604 876 620 Q 691 633 500 629 Q 309 633 124 620 Z" fill="#0B3768" />
  <ellipse cx="500" cy="649" rx="102" ry="20" fill="#C9A24E" />
