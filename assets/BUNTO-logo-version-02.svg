  <title id="title">BUNTO.CO Logo — Version 02</title>
  <desc id="desc">Editable circular logo with a fine navy ring, a large gold sun behind a straight torii gate, reflected water lines, and BUNTO.CO curved along the lower arc.</desc>
  <defs>
    <path id="bunto-arc" d="M 196 686 A 370 370 0 0 0 804 686" />
  </defs>
  <circle cx="500" cy="500" r="465" fill="none" stroke="#0B3768" stroke-width="17" />

  <circle cx="500" cy="317" r="188" fill="#C9A24E" />

  <g fill="#0B3768">
    <path d="M 208 248 L 286 287 Q 500 330 714 287 L 792 248 L 762 302 Q 500 360 238 302 Z" />
    <path d="M 271 333 L 729 333 L 729 374 L 271 374 Z" />
    <path d="M 342 338 L 389 338 L 389 586 L 342 586 Z" />
    <path d="M 611 338 L 658 338 L 658 586 L 611 586 Z" />
    <path d="M 325 578 L 406 578 L 406 601 L 325 601 Z" />
    <path d="M 594 578 L 675 578 L 675 601 L 594 601 Z" />
  </g>

  <!-- Fine gold inlays on the gate -->
  <g fill="#C9A24E">
    <rect x="305" y="345" width="42" height="13" rx="2" />
    <rect x="653" y="345" width="42" height="13" rx="2" />
    <rect x="414" y="345" width="172" height="13" rx="2" />
  </g>

