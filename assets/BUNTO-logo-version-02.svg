  <text fill="#0B3768" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="600" letter-spacing="7">
    <textPath href="#bunto-arc" xlink:href="#bunto-arc" startOffset="50%" text-anchor="middle">BUNTO.CO</textPath>
  </text>
